name: adfl-isolated-tests

services:
  postgres-isolated:
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    labels:
      life.adfl.purpose: disposable-test
      life.adfl.test-run: ${ADFL_TEST_RUN_ID:?The isolated runner must supply its ownership identity}
    environment:
      POSTGRES_DB: adfl_test_runner
      POSTGRES_USER: adfl_test
      POSTGRES_PASSWORD: synthetic-local-test-only
    ports:
      - '127.0.0.1:55434:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U adfl_test -d adfl_test_runner']
      interval: 1s
      timeout: 3s
      retries: 30

networks:
  default:
    labels:
      life.adfl.purpose: disposable-test
      life.adfl.test-run: ${ADFL_TEST_RUN_ID:?The isolated runner must supply its ownership identity}
