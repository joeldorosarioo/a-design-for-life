name: a-design-for-life-local

x-postgres-image: &postgres-image postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b

services:
  postgres-local:
    image: *postgres-image
    environment:
      POSTGRES_DB: adfl_local
      POSTGRES_USER: adfl_local
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:?Configure LOCAL_POSTGRES_PASSWORD em .env}
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - postgres-local-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U adfl_local -d adfl_local']
      interval: 2s
      timeout: 3s
      retries: 30
  postgres-test:
    image: *postgres-image
    profiles: ['test']
    environment:
      POSTGRES_DB: adfl_test_base
      POSTGRES_USER: adfl_test
      POSTGRES_PASSWORD: synthetic-local-test-only
    ports:
      - '127.0.0.1:55433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U adfl_test -d adfl_test_base']
      interval: 1s
      timeout: 3s
      retries: 30

volumes:
  postgres-local-data:
