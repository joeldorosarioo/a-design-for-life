name: Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adfl-checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verification:
    name: type-lint-test-architecture-build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      APP_ENV: test
      PAYLOAD_SECRET: synthetic-ci-secret-never-used-outside-isolated-tests
      DATABASE_URI: postgres://adfl_test:synthetic-local-test-only@127.0.0.1:5432/a_design_for_life_rebuild
      SITE_ORIGIN: http://127.0.0.1:3100
      MEDIA_BUCKET: adfl-test-ci
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          package-manager-cache: false
      - name: pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.10.1
          run_install: false
          cache: true
      - name: Install from lockfile
        run: pnpm install --frozen-lockfile
      - name: Cache Next.js and TypeScript compilation
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .work/next-build/cache
            .work/cache/typescript.tsbuildinfo
          key: ${{ runner.os }}-${{ runner.arch }}-node26.13.1-build-v1-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', 'next.config.ts', 'tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-node26.13.1-build-v1-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', 'next.config.ts', 'tsconfig.json') }}-
      - name: Install verified local PDF checker
        run: pnpm setup:media-checker
      - name: Install verified local backup tools
        run: pnpm setup:backup-tools
      - name: Configure synthetic backup test tools
        run: |
          config="$(node testing/setup/configure-backup-tools.mjs)"
          test -f "$config"
          printf 'ADFL_TEST_BACKUP_TOOLS_CONFIG=%s\n' "$config" >> "$GITHUB_ENV"
      - name: Verify without database access
        run: pnpm verify:ci
