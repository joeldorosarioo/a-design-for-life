name: Deploy

on:
  push:
    branches: [develop, main]

permissions:
  contents: read

# Keep build, deploy and the tested-image marker in one branch-wide queue.
# Another push must not redeploy staging between its health check and marker.
concurrency:
  group: adfl-ci-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-staging:
    name: Build private staging image
    permissions:
      contents: read
      packages: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && vars.STAGING_AUTODEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
      source-tree: ${{ steps.identity.outputs.source-tree }}
      migration-tree: ${{ steps.identity.outputs.migration-tree }}
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          package-manager-cache: false
      - name: Identify the exact source
        id: identity
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          migration_tree="$(git rev-parse HEAD:src/migrations)"
          [[ "$revision" =~ ^[a-f0-9]{40}$ && "$revision" == "$GITHUB_SHA" ]]
          [[ "$source_tree" =~ ^[a-f0-9]{40}$ && "$migration_tree" =~ ^[a-f0-9]{40}$ ]]
          test -z "$(git status --porcelain)"
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          image="$repository:commit-$revision"
          printf 'revision=%s\nsource-tree=%s\nmigration-tree=%s\nimage=%s\n' "$revision" "$source_tree" "$migration_tree" "$image" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build, inspect and publish the single private Linux image
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_OWNER_TYPE: ${{ github.event.repository.owner.type }}
          SOURCE_REVISION: ${{ steps.identity.outputs.revision }}
          SOURCE_TREE: ${{ steps.identity.outputs.source-tree }}
          IMAGE_REFERENCE: ${{ steps.identity.outputs.image }}
        run: |
          set -euo pipefail
          assert_private_package() {
            node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const [owner, name] = process.env.GITHUB_REPOSITORY.split('/');
          const type = process.env.PACKAGE_OWNER_TYPE;
          assert.ok(type === 'User' || type === 'Organization', 'Unexpected package owner type.');
          const prefix = type === 'Organization' ? 'orgs' : 'users';
          const url = `https://api.github.com/${prefix}/${encodeURIComponent(owner)}/packages/container/${encodeURIComponent(name.toLowerCase())}`;
          const response = await fetch(url, {
            headers: {
              Authorization: `Bearer ${process.env.GH_TOKEN}`,
              Accept: 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'ADFL-Private-Image-Workflow',
            },
            redirect: 'error',
            signal: AbortSignal.timeout(15000),
          });
          assert.equal(response.status, 200, 'Existing package metadata must be accessible.');
          assert.equal((await response.json()).visibility, 'private', 'Registry package must remain private.');
          NODE
          }
          assert_private_package
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          cache_reference="$repository:build-cache"
          docker buildx build --load --platform linux/amd64 \
            --provenance=false --sbom=false \
            --build-arg "SOURCE_REVISION=$SOURCE_REVISION" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "life.adfl.source-tree=$SOURCE_TREE" \
            --cache-from "type=registry,ref=$cache_reference" \
            --cache-to "type=registry,ref=$cache_reference,mode=max,image-manifest=true,ignore-error=true" \
            --tag "$IMAGE_REFERENCE" --progress plain .
          image_id="$(docker image inspect --format '{{.Id}}' "$IMAGE_REFERENCE")"
          node ops/image/inspect-local-image.mjs "$IMAGE_REFERENCE" "$image_id" "$SOURCE_REVISION"
          [[ "$(docker image inspect --format '{{index .Config.Labels "life.adfl.source-tree"}}' "$image_id")" == "$SOURCE_TREE" ]]
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,uid=70,gid=70,mode=0700,size=64m \
            --cpus 1 --memory 2g --memory-swap 2g --pids-limit 128 \
            --cap-drop ALL --security-opt no-new-privileges \
            --entrypoint node "$image_id" ops/image/runtime-smoke.mjs
          assert_private_package
          docker push "$IMAGE_REFERENCE"
          assert_private_package
          reference="$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE_REFERENCE")"
          [[ "$reference" == "$repository@sha256:"* ]]
          digest="${reference#"$repository@"}"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          # Coolify consumes a tag, so publish its immutable digest alias first.
          # Reuse the same local image; verify the remote manifest is unchanged.
          immutable_reference="$repository:${digest/:/-}"
          docker tag "$IMAGE_REFERENCE" "$immutable_reference"
          docker push "$immutable_reference"
          published_digest="$(docker buildx imagetools inspect "$immutable_reference" --format '{{.Manifest.Digest}}')"
          [[ "$published_digest" == "$digest" ]]
          assert_private_package
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Remove registry credentials
        if: always()
        run: docker logout ghcr.io

  deploy-staging:
    name: Deploy staging and wait for health
    needs: build-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && vars.STAGING_AUTODEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    environment: staging
    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          package-manager-cache: false
      - name: Deploy the immutable image to staging
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_DEPLOY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
          COOLIFY_BACKUP_TOKEN: ${{ secrets.COOLIFY_BACKUP_TOKEN }}
          COOLIFY_BACKUP_TASK_UUID: ${{ vars.COOLIFY_BACKUP_TASK_UUID }}
          COOLIFY_RESOURCE_UUID: ${{ vars.COOLIFY_RESOURCE_UUID }}
          APPROVED_MIGRATION_TREE: ${{ vars.APPROVED_MIGRATION_TREE }}
          IMAGE_DIGEST: ${{ needs.build-staging.outputs.digest }}
          MIGRATION_TREE: ${{ needs.build-staging.outputs.migration-tree }}
        run: node ops/deploy/coolify.mjs --environment staging --digest "$IMAGE_DIGEST" --migration-tree "$MIGRATION_TREE"

  mark-staging-tested:
    name: Record the healthy staging image
    needs: [build-staging, deploy-staging]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && vars.STAGING_AUTODEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout registry scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          package-manager-cache: false
      - name: Mark the exact image after staging is healthy
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TREE: ${{ needs.build-staging.outputs.source-tree }}
          IMAGE_DIGEST: ${{ needs.build-staging.outputs.digest }}
        run: node ops/deploy/registry.mjs mark --source-tree "$SOURCE_TREE" --digest "$IMAGE_DIGEST"

  resolve-production-image:
    name: Resolve the image already tested in staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PRODUCTION_AUTODEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    outputs:
      digest: ${{ steps.resolve.outputs.digest }}
      migration-tree: ${{ steps.identity.outputs.migration-tree }}
    steps:
      - name: Checkout the production source tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          package-manager-cache: false
      - name: Resolve exact source and migration trees
        id: identity
        run: |
          set -euo pipefail
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          migration_tree="$(git rev-parse HEAD:src/migrations)"
          [[ "$source_tree" =~ ^[a-f0-9]{40}$ && "$migration_tree" =~ ^[a-f0-9]{40}$ ]]
          printf 'source-tree=%s\nmigration-tree=%s\n' "$source_tree" "$migration_tree" >> "$GITHUB_OUTPUT"
      - name: Resolve the tested manifest without rebuilding
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TREE: ${{ steps.identity.outputs.source-tree }}
          APPROVED_STAGING_REVISION: ${{ vars.APPROVED_STAGING_REVISION }}
          APPROVED_IMAGE_DIGEST: ${{ vars.APPROVED_IMAGE_DIGEST }}
        run: node ops/deploy/registry.mjs resolve --source-tree "$SOURCE_TREE"

  deploy-production:
    name: Promote the tested image to production
    needs: resolve-production-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PRODUCTION_AUTODEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    environment: production
    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          package-manager-cache: false
      - name: Deploy the same immutable image to production
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_DEPLOY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
          COOLIFY_BACKUP_TOKEN: ${{ secrets.COOLIFY_BACKUP_TOKEN }}
          COOLIFY_BACKUP_TASK_UUID: ${{ vars.COOLIFY_BACKUP_TASK_UUID }}
          COOLIFY_RESOURCE_UUID: ${{ vars.COOLIFY_RESOURCE_UUID }}
          APPROVED_MIGRATION_TREE: ${{ vars.APPROVED_MIGRATION_TREE }}
          IMAGE_DIGEST: ${{ needs.resolve-production-image.outputs.digest }}
          MIGRATION_TREE: ${{ needs.resolve-production-image.outputs.migration-tree }}
        run: node ops/deploy/coolify.mjs --environment production --digest "$IMAGE_DIGEST" --migration-tree "$MIGRATION_TREE"
