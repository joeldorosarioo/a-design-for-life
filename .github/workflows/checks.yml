name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verification:
    name: type-lint-test-architecture-build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      APP_ENV: test
      PAYLOAD_SECRET: synthetic-ci-secret-never-used-outside-isolated-tests
      DATABASE_URI: postgres://adfl_test:synthetic-local-test-only@127.0.0.1:55434/adfl_test_build
      SITE_ORIGIN: http://127.0.0.1:3100
      MEDIA_BUCKET: adfl-test-ci
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.work/playwright-browsers
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          package-manager-cache: false
      - name: pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.10.1
          run_install: false
      - name: Install from lockfile
        run: pnpm install --frozen-lockfile
      - name: Check isolated container tooling
        run: docker compose version
      - name: Verify
        run: pnpm verify
      - name: Install Chromium headless shell
        run: pnpm exec playwright install --with-deps chromium --only-shell
      - name: Browser journeys
        run: pnpm test:e2e
