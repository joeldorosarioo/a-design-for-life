name: a-design-for-life-local

services:
  postgres:
    image: adfl:local-alpine3.24
    build:
      context: .
    command: [node, ops/image/start-local-stack.mjs]
    env_file: .env
    environment:
      # Registry credentials are consumed by Docker/Coolify, never by the application.
      GHCR_READ_TOKEN: ''
      GHCR_PUBLISH_TOKEN: ''
      APP_ENV: local
      LOCAL_DATABASE_ONLY: 'true'
      PUBLIC_SITE_ENABLED: 'false'
      PUBLICATION_RETRIES_ENABLED: 'false'
      PUBLICATION_RETRY_WORKER_ENABLED: 'false'
      PUBLICATION_HTTP_VERIFICATION_ENABLED: 'false'
    user: '70:70'
    labels:
      life.adfl.purpose: shared-local
    cpus: '${PORTFOLIO_CPU_LIMIT:-1.0}'
    mem_limit: ${PORTFOLIO_MEMORY_LIMIT:-2g}
    memswap_limit: ${PORTFOLIO_MEMORY_LIMIT:-2g}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 45s
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: [CMD, node, ops/image/health-probe.mjs]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
    external: true
    name: a-design-for-life-rebuild-postgres-data

networks:
  default:
    labels:
      life.adfl.purpose: shared-local
