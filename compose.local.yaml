name: a-design-for-life-local

services:
  portfolio:
    image: adfl:local-alpine3.24
    build:
      context: .
    command: [node, ops/image/start-local-stack.mjs]
    env_file: .env
    environment:
      # Registry credentials are consumed by Docker/Coolify, never by the application.
      GHCR_READ_TOKEN: ''
      GHCR_PUBLISH_TOKEN: ''
      APP_ENV: local
      INTERNAL_HTTP_ORIGIN: http://127.0.0.1:3000
      MEDIA_STORAGE_DRIVER: ${MEDIA_STORAGE_DRIVER:-r2}
      PUBLIC_SITE_ENABLED: 'false'
      PUBLICATION_RETRY_WORKER_ENABLED: 'false'
      PUBLICATION_HTTP_VERIFICATION_ENABLED: 'false'
    user: '70:70'
    cpus: '${PORTFOLIO_CPU_LIMIT:-1.0}'
    mem_limit: ${PORTFOLIO_MEMORY_LIMIT:-2g}
    memswap_limit: ${PORTFOLIO_MEMORY_LIMIT:-2g}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 45s
    ports:
      - '127.0.0.1:3000:3000'
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - publication:/app/.work/publication
      - private-media:/app/.work/private-media
      - editorial-mail:/app/.work/editorial-mail
      - optimized-images:/app/.work/next-build/cache/images

volumes:
  postgres-data:
    external: true
    name: a-design-for-life-rebuild-postgres-data
  publication:
  private-media:
  editorial-mail:
  optimized-images:
